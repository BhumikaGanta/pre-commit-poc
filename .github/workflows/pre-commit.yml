name: Pre-commit

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: pre-commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRE_COMMIT_RUNTIME_THRESHOLD_SECONDS: "300"

jobs:
  pre-commit:
    name: Run pre-commit checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pre-commit cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-format

      - name: Install macOS system packages
        if: runner.os == 'macOS'
        run: brew install cppcheck clang-format

      - name: Install Windows system packages
        if: runner.os == 'Windows'
        run: choco install cppcheck llvm -y --no-progress

      - name: Install Node dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } elseif (Test-Path package.json) {
            npm install
          }

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Run pre-commit hooks with runtime threshold
        shell: pwsh
        run: |
          $threshold = [int]$env:PRE_COMMIT_RUNTIME_THRESHOLD_SECONDS
          $startedAt = Get-Date
          pre-commit run --all-files --show-diff-on-failure
          $exitCode = $LASTEXITCODE
          $elapsed = [int]((Get-Date) - $startedAt).TotalSeconds

          "### Pre-commit runtime" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Metric | Value |" >> $env:GITHUB_STEP_SUMMARY
          "| --- | --- |" >> $env:GITHUB_STEP_SUMMARY
          "| Runner OS | $env:RUNNER_OS |" >> $env:GITHUB_STEP_SUMMARY
          "| Elapsed seconds | $elapsed |" >> $env:GITHUB_STEP_SUMMARY
          "| Threshold seconds | $threshold |" >> $env:GITHUB_STEP_SUMMARY

          if ($exitCode -ne 0) {
            exit $exitCode
          }

          if ($elapsed -gt $threshold) {
            Write-Error "Pre-commit runtime ${elapsed}s exceeded threshold ${threshold}s."
            exit 1
          }
