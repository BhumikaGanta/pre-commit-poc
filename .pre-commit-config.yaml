repos:
  # Common checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json

  # Python formatting
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3

  # Python linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  # JS formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier

  # Secret scanning
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.28.0
    hooks:
      - id: eslint
        files: \.(js|jsx|ts|tsx)$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets

  # Local hooks for languages not provided by upstream repos
  - repo: local
    hooks:
      - id: checkstyle
        name: Checkstyle (Java)
        entry: python tools/pre-commit/checkstyle.py
        language: python
        description: Run Checkstyle via Maven or Gradle if Java files exist
        files: '\.java$'

  - repo: local
    hooks:
      - id: tsc
        name: TypeScript Compiler Check
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
